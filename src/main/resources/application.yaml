spring:
  application:
    name: platform
  profiles:
    active: dev
  servlet:
    multipart:
      enabled: true
      max-request-size: 10MB
      max-file-size: 1MB
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss

# 日志配置（通用）
logging:
  include-application-name: false
  level:
    root: INFO
  file:
    name: logs/platform.log
  logback:
    rolling-policy:
      max-file-size: 10MB
      max-history: 30

file:
  upload-dir: ./uploads

# MyBatis 配置（通用）
mybatis:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.bryan.platform.domain.entity
  configuration:
    map-underscore-to-camel-case: true
    default-enum-type-handler: org.apache.ibatis.type.EnumOrdinalTypeHandler

# JWT 配置
jwt:
  secret-key: BryanTaoLong!@#SuperSecretKeyJwtToken27926
  expiration-ms: 86400000  # 24小时
  token-prefix: "Bearer "

# 第三方 API 配置（通用）
llm:
  api:
    # 默认使用的大模型提供商：deepseek、moonshot、minimax
    default-provider: deepseek
    # 各大模型提供商配置
    providers:
      deepseek:
        key: "${DEEPSEEK_API_KEY}" # Set your own api key as environment variable
        url: "https://api.deepseek.com/chat/completions"
        model: "deepseek-chat"
      moonshot:
        key: "${MOONSHOT_API_KEY:}" # 可选：Moonshot API Key
        url: "https://api.moonshot.cn/v1/chat/completions"
        model: "kimi-k2-turbo-preview"
      minimax:
        key: "${MINIMAX_API_KEY:}" # 可选：MiniMax API Key
        url: "https://api.minimaxi.com/v1/chat/completions"
        model: "MiniMax-M2.1"