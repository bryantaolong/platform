spring:
  application:
    name: platform
  profiles:
    active: dev
  servlet:
    multipart:
      enabled: true
      max-request-size: 10MB
      max-file-size: 1MB
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
  task:
    execution:
      pool:
        core-size: 2
        max-size: 10
        queue-capacity: 100
      thread-name-prefix: task-
    scheduling:
      pool:
        size: 2
      thread-name-prefix: scheduled-

# 异步配置
async:
  core-pool-size: 4
  max-pool-size: 10
  queue-capacity: 100
  thread-name-prefix: async-

# 日志配置
logging:
  include-application-name: false
  level:
    root: INFO
  file:
    name: logs/platform.log
  logback:
    rolling-policy:
      max-file-size: 10MB
      max-history: 30

file:
  upload-dir: ./uploads

# MyBatis 配置
mybatis:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.bryan.platform.domain.entity
  configuration:
    map-underscore-to-camel-case: true
    default-enum-type-handler: org.apache.ibatis.type.EnumOrdinalTypeHandler

# JWT 配置
jwt:
  secret-key: "${JWT_SECRET_KEY:BryanTaoLong!@#SuperSecretKeyJwtToken27926}" # 使用环境变量，带默认值
  expiration-ms: 86400000  # 24小时
  token-prefix: "Bearer "

# 安全配置
security:
  login-fail-limit: 5              # 登录失败次数限额
  login-fail-reset-minutes: 30     # 登录失败计数重置时间（分钟）
  account-lock-duration-minutes: 30 # 账号锁定时间（分钟）

# CORS 配置
cors:
  allowed-origins: "${CORS_ALLOWED_ORIGINS:http://localhost:5173}"

# 第三方 API 配置
llm:
  api:
    default-provider: deepseek
    providers:
      deepseek:
        key: "${DEEPSEEK_API_KEY}" # Set your own api key as environment variable
        url: "https://api.deepseek.com/chat/completions"
        model: "deepseek-chat"
      moonshot:
        key: "${MOONSHOT_API_KEY:}" # 可选：Moonshot API Key
        url: "https://api.moonshot.cn/v1/chat/completions"
        model: "kimi-k2-turbo-preview"
      minimax:
        key: "${MINIMAX_API_KEY:}" # 可选：MiniMax API Key
        url: "https://api.minimaxi.com/v1/chat/completions"
        model: "MiniMax-M2.1"